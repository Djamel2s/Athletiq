global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 15s
    static_configs:
      # Docker Desktop / Windows: use host.docker.internal
      - targets: ['host.docker.internal:3001']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
