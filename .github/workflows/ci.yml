name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Lint backend
        working-directory: backend
        run: |
          npm ci
          npm run format:check
          npm run lint
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci
      - name: Run backend tests
        working-directory: backend
        run: |
          npm test
      - name: Audit backend (fail on high)
        working-directory: backend
        run: |
          npm audit --audit-level=high

  frontend-tests:
    name: Frontend build + audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build
      - name: Audit frontend (fail on high)
        working-directory: frontend
        run: |
          npm audit --audit-level=high
      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.output
            frontend/.nuxt
