  <line x1="88" y1="128" x2="112" y2="128" stroke="#c4b4a0" stroke-width="1" opacity="0.3"/>
  <line x1="89" y1="138" x2="111" y2="138" stroke="#c4b4a0" stroke-width="1" opacity="0.3"/>
  <line x1="91" y1="148" x2="109" y2="148" stroke="#c4b4a0" stroke-width="1" opacity="0.3"/>

  <!-- Bras gauche (leve, tenant la barre) -->
  <!-- Biceps -->
  <path d="M62 68 Q48 64 38 52 Q34 46 38 42 L46 44 Q50 50 56 56 Q60 62 62 68Z" fill="url(#g)"/>
  <!-- Avant-bras -->
  <path d="M38 42 Q34 34 32 24 Q32 20 36 20 L42 22 Q40 30 42 38Z" fill="#d4c4b0"/>

  <!-- Bras droit (leve, tenant la barre) -->
  <!-- Biceps -->
  <path d="M138 68 Q152 64 162 52 Q166 46 162 42 L154 44 Q150 50 144 56 Q140 62 138 68Z" fill="url(#g)"/>
  <!-- Avant-bras -->
  <path d="M162 42 Q166 34 168 24 Q168 20 164 20 L158 22 Q160 30 158 38Z" fill="#d4c4b0"/>

  <!-- Barre d'haltere -->
  <line x1="14" y1="20" x2="186" y2="20" stroke="url(#bar)" stroke-width="5" stroke-linecap="round"/>

  <!-- Disques gauche -->
  <rect x="14" y="8" width="10" height="24" rx="3" fill="#d4c4b0"/>
  <rect x="4" y="11" width="10" height="18" rx="3" fill="#b8a48f"/>

  <!-- Disques droit -->
  <rect x="176" y="8" width="10" height="24" rx="3" fill="#d4c4b0"/>
  <rect x="186" y="11" width="10" height="18" rx="3" fill="#b8a48f"/>

  <!-- Jambes (forme en A / V) -->
