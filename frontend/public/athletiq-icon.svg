<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#d4c4b0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8a48f"/>
      <stop offset="50%" stop-color="#d4c4b0"/>
      <stop offset="100%" stop-color="#b8a48f"/>
    </linearGradient>
  </defs>

  <!-- Tete -->
  <circle cx="100" cy="32" r="18" fill="url(#g)"/>

  <!-- Cou -->
  <rect x="93" y="48" width="14" height="12" rx="4" fill="#d4c4b0"/>

  <!-- Epaules + Trapèzes (larges, musculaires) -->
