  <!-- Ligne pectorale centrale -->
  <line x1="100" y1="66" x2="100" y2="108" stroke="#c4b4a0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Separation pectorale -->
  <path d="M76 78 Q88 86 100 84 Q112 86 124 78" fill="none" stroke="#c4b4a0" stroke-width="1.2" opacity="0.4"/>

